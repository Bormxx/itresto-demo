version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: itresto_demo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: itresto_demo
      POSTGRES_PASSWORD: itresto_demo_password
      POSTGRES_DB: itresto_demo
    ports:
      - "5433:5432"  # Используем порт 5433 чтобы не конфликтовать с основной БД
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itresto_demo -d itresto_demo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  demo_postgres_data:
    name: itresto_demo_postgres_data
